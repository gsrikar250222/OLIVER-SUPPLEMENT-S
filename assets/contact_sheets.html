      padding: 3px 8px;
      border-radius: 4px;

    .header-stats {
      display: flex;
      gap: 16px;

      color: var(--text-muted);

      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    nav.category-tabs button:hover, nav.category-tabs button.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);

      margin: 32px auto;
      padding: 0 32px;

      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-count {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .media-container {
      position: relative;
      background: #000;
      aspect-ratio: 2 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .media-container.banner-desktop {
      aspect-ratio: 1800 / 633;
    }
    .media-container.banner-mobile {
      aspect-ratio: 1080 / 1774;
    }
    .media-container.video-aspect {
      aspect-ratio: 9 / 16;
    }
    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .card:hover .media-container img {
      transform: scale(1.04);
    }
    .media-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .meta-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .badge-resolution {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .badge-selected {
      background: var(--accent);
      color: #000;
    }
    .badge-warning {
      background: var(--danger);
      color: #fff;
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .file-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }
    .file-details {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .branding-note {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--accent);
      color: #cbd5e1;
      margin-top: auto;
    }
    .branding-note.needs-replace {
      border-left-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }

    function renderGrid(items, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.category = item.category || item.group;

        let aspectClass = '';
        if (item.category === 'desktop') aspectClass = 'banner-desktop';
        else if (item.category === 'mobile') aspectClass = 'banner-mobile';
        else if (item.format === 'mp4') aspectClass = 'video-aspect';

        let mediaHtml = '';
        if (item.format === 'mp4') {
          mediaHtml = <video src="../" controls preload="metadata" loop muted playsinline></video>;
        } else {
          mediaHtml = <img src="../" alt="" loading="lazy">;
        }

        const replaceBadge = item.needsReplacement 
          ? <span class="badge badge-warning">Needs Rebrand</span> 
          : <span class="badge badge-selected">Best Selection</span>;

        card.innerHTML = 
          <div class="media-container ">
            
            <div class="meta-overlay">
              <span class="badge badge-resolution">x (:1)</span>
              
            </div>
          </div>
          <div class="card-body">
            <div class="file-name"></div>
            <div class="file-details">
              <span>Category: <strong></strong></span>
              <span>Size: <strong> KB</strong></span>
            </div>
            <div class="branding-note ">
              
            </div>
          </div>
        ;
        container.appendChild(card);
      });
    }

    function renderAll() {
      const main = document.getElementById('content');
      main.innerHTML = '';

      const groups = {};
      manifest.assets.forEach(a => {
        const key = a.category || a.group;
        if (!groups[key]) groups[key] = [];
        groups[key].push(a);
      });

      for (const cat in groups) {
        const sec = document.createElement('section');
        sec.id = 'sec-' + cat;
        sec.innerHTML = 
          <div class="section-header">
            <div class="section-title">
              <span></span>
              <span class="section-count"> ASSETS</span>
            </div>
          </div>
          <div class="grid" id="grid-"></div>
        ;
        main.appendChild(sec);
        renderGrid(groups[cat], 'grid-' + cat);
      }
    }

    function filterCategory(cat) {
      document.querySelectorAll('nav.category-tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (cat === 'all') {
        renderAll();
      } else if (cat === 'videos') {
        const vids = manifest.assets.filter(a => a.format === 'mp4');
        const main = document.getElementById('content');
        main.innerHTML = 
          <div class="section-header">
            <div class="section-title">
              <span>VIDEOS & SHOWCASES</span>
              <span class="section-count"> VIDEOS</span>
            </div>
          </div>
          <div class="grid" id="grid-videos"></div>
        ;
        renderGrid(vids, 'grid-videos');
      } else {
        const filtered = manifest.assets.filter(a => (a.category === cat || a.group === cat));
        const main = document.getElementById('content');
        main.innerHTML = 
          <div class="section-header">
            <div class="section-title">
              <span></span>
              <span class="section-count"> ASSETS</span>
            </div>
          </div>
          <div class="grid" id="grid-filtered"></div>
        ;
        renderGrid(filtered, 'grid-filtered');
      }
    }

    renderAll();
