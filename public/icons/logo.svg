<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" fill="none">
  <!-- REPVAULT Luxury Fashion Identity - Dark Version -->
  <defs>
    <linearGradient id="rv-gold-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#2a2a2e"/>
    </linearGradient>
  </defs>

  <!-- Geometric Luxury Monogram: Architectural Vault Key & Precision R -->
  <g id="brand-symbol" transform="translate(4, 4)">
    <!-- Outer Shield / Diamond Facet -->
    <rect x="2" y="2" width="56" height="56" rx="14" fill="#0d0d11" />
    <rect x="3.5" y="3.5" width="53" height="53" rx="12.5" stroke="#27272a" stroke-width="1.5" fill="none"/>
    
    <!-- Stylized Precision R-Vault Glyph -->
    <path d="M22 17 V43 M22 17 H34 C39.5 17 39.5 28 34 28 H22 M32 28 L41 43" 
          stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle Kinetic Chevron Accent -->
    <path d="M38 18 L43 23 L38 28" 
          stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Typography: Luxury High-Fashion Spacing -->
  <g transform="translate(74, 38)">
    <text font-family="'Space Grotesk', 'Montserrat', -apple-system, sans-serif" 
          font-size="25" 
          font-weight="800" 
          letter-spacing="6" 
          fill="#0a0a0c">REPVAULT</text>
  </g>
  <g transform="translate(76, 52)">
    <text font-family="'Space Grotesk', 'Montserrat', -apple-system, sans-serif" 
          font-size="8" 
          font-weight="600" 
          letter-spacing="5.5" 
          fill="#71717a">ATHLETIC COUTURE • EST. 2026</text>
  </g>
</svg>
