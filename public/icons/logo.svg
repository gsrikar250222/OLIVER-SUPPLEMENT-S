<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" fill="none">
  <defs>
    <linearGradient id="oliver-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2424"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B8000A"/>
    </linearGradient>
    <linearGradient id="oliver-metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>
    <filter id="oliver-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E50914" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagonal Athletic Shield Monogram (The 'O' Engine) -->
  <g id="brand-symbol" transform="translate(6, 6)" filter="url(#oliver-glow)">
    <!-- Outer Octagonal / Chamfered Iron Shield -->
    <path d="M30 4 L54 16 L54 44 L30 56 L6 44 L6 16 Z" fill="#111111" stroke="#303030" stroke-width="2"/>
    <path d="M30 8 L50 18 L50 42 L30 52 L10 42 L10 18 Z" fill="#171717" stroke="url(#oliver-red-grad)" stroke-width="2"/>
    
    <!-- Heavy Athletic 'O' Monogram with Kinetic Cutout -->
    <path d="M30 14 C39 14 44 20 44 30 C44 40 39 46 30 46 C21 46 16 40 16 30 C16 20 21 14 30 14 Z M30 22 C25 22 23 26 23 30 C23 34 25 38 30 38 C35 38 37 34 37 30 C37 26 35 22 30 22 Z" fill="url(#oliver-metal-grad)"/>
    
    <!-- Red Dynamic Power Slash / Bolt Accent -->
    <path d="M38 18 L26 34 H34 L22 44 L27 33 H20 Z" fill="url(#oliver-red-grad)"/>
  </g>

  <!-- Wordmark: OLIVER SUPPLEMENT SHOP -->
  <g transform="translate(74, 40)">
    <!-- Primary Brand Name -->
    <text font-family="'Montserrat', 'Impact', sans-serif" 
          font-size="32" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="3" 
          fill="#FFFFFF">OLIVER</text>
  </g>

  <!-- Red Accent Sub-Pill -->
  <g transform="translate(230, 18)">
    <rect x="0" y="0" width="175" height="24" rx="4" fill="#E50914"/>
    <text font-family="'Montserrat', sans-serif" 
          font-size="10.5" 
          font-weight="800" 
          letter-spacing="2" 
          fill="#FFFFFF" 
          x="8" y="16">SPORTS NUTRITION</text>
  </g>

  <!-- Subtitle: SUPPLEMENT SHOP -->
  <g transform="translate(75, 59)">
    <text font-family="'Montserrat', sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#B8B8B8">SUPPLEMENT SHOP</text>
    <circle cx="218" cy="-3.5" r="2" fill="#E50914"/>
    <text font-family="'Montserrat', sans-serif" 
          font-size="10" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#777777" 
          x="226" y="0">100% GENUINE</text>
  </g>
</svg>