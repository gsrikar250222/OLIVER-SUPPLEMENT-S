<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REPVAULT – 3D Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,600;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--pearl:#F7F8FC;--silver:#E8EAF2;--navy:#10182D;--grey:#737B8C;--blue:#00BFFF;--violet:#873BFF;--soft:#B99AFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--pearl);color:var(--navy);font-family:'Exo 2',system-ui,'Segoe UI',sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1360px;margin:0 auto;padding:22px 28px}
.logo{font-weight:900;font-style:italic;font-size:30px;letter-spacing:-.5px}
.logo small{display:block;font-size:10px;font-style:normal;font-weight:600;letter-spacing:.42em;color:var(--grey);margin-top:2px}
.tag{font-size:13px;letter-spacing:.3em;color:var(--navy)}
main{max-width:1360px;margin:0 auto;padding:0 20px 40px;display:grid;gap:28px}
.col{position:relative;display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr) 240px;gap:24px;align-items:center;padding:44px 40px;min-height:660px;border-radius:32px;overflow:hidden;border:1px solid var(--silver);background:radial-gradient(60% 70% at 50% 55%,#fff 0%,rgba(255,255,255,0) 70%),radial-gradient(40% 50% at 8% 100%,rgba(0,191,255,.10),transparent),radial-gradient(40% 50% at 95% 0%,rgba(135,59,255,.10),transparent),linear-gradient(160deg,#fff,var(--silver))}
.col::before{content:'R';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(-8deg);font-size:620px;line-height:1;font-weight:900;font-style:italic;color:transparent;-webkit-text-stroke:2px rgba(185,154,255,.28);pointer-events:none}
.col>*{position:relative}
.eye{font-size:14px;letter-spacing:.28em;color:var(--grey);padding-bottom:10px;position:relative}
.eye::after{content:'';position:absolute;left:0;bottom:0;width:86px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--violet))}
h2{font-size:clamp(34px,4.2vw,52px);line-height:1;font-weight:900;font-style:italic;margin:22px 0 14px;letter-spacing:-.02em}
.txt p{color:var(--grey);line-height:1.55;margin:0 0 22px;max-width:30ch}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.feat div{display:grid;justify-items:center;gap:6px;font-size:12px;text-align:center;color:var(--navy)}
.ic{width:30px;height:30px;fill:none;stroke:var(--navy);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cta{display:inline-flex;align-items:center;gap:12px;padding:15px 26px;border-radius:40px;background:linear-gradient(100deg,var(--navy),#2a1b6b);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.08em;font-size:14px;box-shadow:0 10px 24px rgba(16,24,45,.22);transition:transform .2s,box-shadow .2s}
.cta:hover,.cta:focus-visible{transform:translateY(-2px);box-shadow:0 14px 28px rgba(135,59,255,.3)}
.mid{min-width:0}
.stage{position:relative;height:560px;cursor:grab;touch-action:pan-y;outline-offset:4px;user-select:none;-webkit-user-select:none}
.stage.grab{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#fff;transition:opacity .6s;z-index:3;border-radius:20px}
.load.done,.nogl .load{opacity:0;pointer-events:none}
.load b{font-size:26px;font-style:italic;font-weight:900}
.load span{font-size:13px;color:var(--grey);letter-spacing:.08em}
.load em{display:block;width:200px;height:6px;border-radius:6px;background:var(--silver);overflow:hidden}
.load i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .35s}
.fb{display:none;position:absolute;inset:0;place-content:center;justify-items:center;gap:8px;color:var(--grey);font-size:13px;text-align:center}
.fb svg{width:180px;fill:var(--navy)}
.nogl .fb{display:grid}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.ctrl button{font:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:30px;border:1px solid var(--silver);background:#fff;color:var(--navy);cursor:pointer;transition:all .2s}
.ctrl button:hover{border-color:var(--soft)}
.ctrl button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.mode{display:flex;gap:4px;padding:4px;border-radius:30px;background:#fff;border:1px solid var(--silver);width:max-content;margin:0 auto 10px}
.mode button{font:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:30px;border:0;background:none;color:var(--grey);cursor:pointer}
.mode button.on{background:linear-gradient(100deg,var(--navy),#2a1b6b);color:#fff}
.photo{position:absolute;inset:0}
.photo img{position:absolute;left:50%;top:5%;height:90%;width:auto;transform:translateX(-50%);opacity:0;mix-blend-mode:multiply;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 58% 56% at 50% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 58% 56% at 50% 52%,#000 62%,transparent 100%)}
.photo img:first-child{opacity:1}
.m-photo .load,.m-photo canvas,.m-photo .ways{display:none}
.m-3d .photo{display:none}
.ways{display:flex;justify-content:center;gap:10px;margin-top:14px;align-items:center;font-size:12px;color:var(--grey)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--silver);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--violet)}
.side{display:grid;gap:18px;justify-items:center}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.thumb{display:grid;justify-items:center;gap:4px;padding:8px 4px 10px;border-radius:18px;border:1px solid transparent;background:rgba(255,255,255,.7);font:inherit;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--navy);cursor:pointer;transition:all .2s}
.thumb img{width:100%;aspect-ratio:200/230;object-fit:contain;display:block}
.thumb.on{border-color:var(--soft);box-shadow:0 8px 20px rgba(135,59,255,.16);background:#fff}
.ind{display:grid;justify-items:center;font-weight:600;font-size:14px;line-height:1.25;text-align:center;letter-spacing:.06em}
.ind svg{width:54px;height:54px;transform:rotate(-90deg)}
.ind circle{fill:none;stroke-width:3.5}
.ind .bg{stroke:var(--silver)}.ind .fg{stroke:url(#g);stroke-linecap:round;stroke-dasharray:125.7;stroke-dashoffset:125.7}
.ind span.d{font-size:20px;font-weight:900;font-style:italic}
footer{text-align:center;color:var(--grey);font-size:12px;letter-spacing:.2em;padding:6px 0 30px}
@media(max-width:1080px){.col{grid-template-columns:minmax(220px,300px) 1fr;padding:34px 28px}.side{grid-column:1/-1;grid-template-columns:1fr auto;align-items:center}.views{grid-template-columns:repeat(4,1fr)}.col::before{font-size:460px}}
@media(max-width:760px){.top{padding:16px}.tag{display:none}main{padding:0 12px 30px}.col{grid-template-columns:1fr;padding:26px 16px;gap:16px;min-height:0;border-radius:24px}.stage{height:430px}.side{grid-template-columns:1fr;gap:12px}.views{gap:6px}.thumb{padding:4px 2px 6px;font-size:10px;letter-spacing:.06em;border-radius:12px}.txt p{max-width:none}.col::before{font-size:340px}.ctrl button{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* REPVAULT Loading Page Enhancements */
.tag-wrap{display:flex;align-items:center;gap:14px}
.live-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(0,191,255,0.08);border:1px solid rgba(0,191,255,0.25);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--navy)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#00BFFF;box-shadow:0 0 8px #00BFFF;animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.cta-enter{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:30px;background:linear-gradient(100deg,var(--navy),#2a1b6b);color:#fff;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.08em;box-shadow:0 8px 20px rgba(16,24,45,.25);transition:transform .2s,box-shadow .2s}
.cta-enter:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(135,59,255,.35)}
.vault-dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(16,24,45,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:40px;padding:10px 18px 10px 24px;display:flex;align-items:center;gap:24px;box-shadow:0 16px 36px rgba(16,24,45,.35);max-width:calc(100vw - 32px)}
.dock-left{display:flex;align-items:center;gap:12px}
.dock-badge{font-size:11px;font-weight:800;letter-spacing:.12em;color:#00BFFF}
.dock-text{font-size:12px;color:#A0A6B8;letter-spacing:.04em}
.dock-right{display:flex;align-items:center;gap:12px}
.dock-link{color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-decoration:none;padding:8px 14px;border-radius:20px;transition:background .2s}
.dock-link:hover{background:rgba(255,255,255,.1)}
.dock-btn-enter{background:linear-gradient(100deg,#00BFFF,#873BFF);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-decoration:none;padding:9px 20px;border-radius:24px;box-shadow:0 4px 15px rgba(0,191,255,.4);transition:transform .2s,box-shadow .2s;white-space:nowrap}
.dock-btn-enter:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(135,59,255,.5)}
@media(max-width:860px){.dock-text{display:none}.vault-dock{gap:12px;padding:8px 14px}.dock-link{display:none}}

</style></head>

/* ===== 3D helpers ===== */
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const wrap=a=>{a%=6.2832;return a<0?a+6.2832:a};
const shortest=d=>{d=wrap(d);return d>Math.PI?d-6.2832:d};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const mk=w=>{const c=k=>new THREE.Color(w[k]).convertSRGBToLinear();const p={base:c('base'),panel:c('panel'),acc:c('acc')};p.seam=p.base.clone().lerp(p.panel,.16);return p};

function loft(P,rings,segs,amp){
 const pos=[],uv=[],meta=[],idx=[];
 for(let i=0;i<=rings;i++){const v=i/rings,p=P(v);
  for(let j=0;j<=segs;j++){const t=j/segs*6.2832,c=Math.cos(t),s=Math.sin(t);
   const n=1+amp*(Math.sin(p.y*9+t*3)+.6*Math.sin(p.y*19-t*5+1));
   pos.push((p.cx||0)+p.rx*c*n,p.y,p.rz*s*n);uv.push(j/segs*50,v*50);meta.push([v,c,s]);}}
 for(let i=0;i<rings;i++)for(let j=0;j<segs;j++){const a=i*(segs+1)+j,b=a+segs+1;idx.push(a,b,a+1,a+1,b,b+1)}
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setIndex(idx);g.computeVertexNormals();g.userData.meta=meta;return g}
function paint(g,fn,pal){const m=g.userData.meta,col=new Float32Array(m.length*3),o=new THREE.Color();
 m.forEach((q,i)=>{fn(q[0],q[1],q[2],pal,o);col[i*3]=o.r;col[i*3+1]=o.g;col[i*3+2]=o.b});
 g.setAttribute('color',new THREE.BufferAttribute(col,3))}
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function drawR(x,X,Y,s){x.save();x.translate(X,Y);x.scale(s,s);x.transform(1,0,-.2,1,.1,0);x.fillStyle='#fff';x.beginPath();
 [[0,1],[.2,0],[.88,0],[1,.14],[.95,.42],[.76,.54],[.98,1],[.72,1],[.55,.6],[.4,.6],[.3,1]].forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();
 x.globalCompositeOperation='destination-out';x.beginPath();[[.36,.2],[.7,.2],[.74,.36],[.62,.44],[.33,.44]].forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.fill();x.restore()}
const FONT='italic 900 84px "Exo 2",Arial,sans-serif';
const T={
 word:()=>tex(512,128,(x,w,h)=>{x.fillStyle='#fff';x.font=FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('REPVAULT',w/2,h/2+4)}),
 r:()=>tex(128,128,x=>drawR(x,14,14,100)),
 bigr:()=>tex(256,256,x=>drawR(x,26,26,196)),
 vert:()=>tex(96,512,(x,w,h)=>{x.translate(w/2,h/2);x.rotate(-Math.PI/2);x.fillStyle='#fff';x.font='italic 900 62px "Exo 2",Arial,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('REPVAULT',0,0)})};
function decal(t,w,h,x0,y0,ecx,rx,rz,back){
 if(back){x0=-x0;ecx=-ecx}
 const g=new THREE.PlaneGeometry(w,h,18,1),p=g.attributes.position;
 for(let i=0;i<p.count;i++){const x=p.getX(i)+x0,rel=(x-ecx)/rx;p.setX(i,x);p.setY(i,p.getY(i)+y0);p.setZ(i,rz*Math.sqrt(Math.max(0,1-rel*rel))+.02)}
 g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:t,transparent:true,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.22,roughness:.55,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
 if(back)m.rotation.y=Math.PI;return m}
let FAB;function fabMat(){
 if(!FAB){FAB=tex(64,64,(x,w,h)=>{x.fillStyle='#808080';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=4)for(let j=0;j<h;j+=4){x.fillStyle=((i+j)/4)%2?'#b8b8b8':'#505050';x.fillRect(i,j,4,4)}});FAB.encoding=THREE.LinearEncoding;FAB.wrapS=FAB.wrapT=THREE.RepeatWrapping}
 return new THREE.MeshStandardMaterial({vertexColors:true,roughness:.78,metalness:.05,bumpMap:FAB,bumpScale:.5,side:THREE.DoubleSide})}
const add=(g,geo,mat,rx)=>{const m=new THREE.Mesh(geo,mat);m.castShadow=true;g.add(m);return m};

/* ===== Garment 01: T-shirt (real lofted geometry) ===== */
function buildTee(){
 const g=new THREE.Group(),parts=[],mats=[],mat=fabMat();
 const body=loft(v=>{const k=ss(.8,1,v);return{y:-1.1+Math.min(v,.8)*2.1+k*.36,rx:v<.8?.64-.1*v:.56-.35*k,rz:v<.8?.31-.02*v:.29-.13*k}},46,48,.018);
 const teeFn=(v,c,s,pal,o)=>{const a=Math.abs(c),thr=.97-.22*v;o.copy(pal.base);if(v>.04&&v<.97){if(a>thr)o.copy(pal.panel);else if(a>thr-.035)o.copy(pal.acc)}};

/* ===== Viewer ===== */
class Viewer{
 constructor(root,kind){this.root=root;this.kind=kind;this.stage=root.querySelector('.stage');this.mode='photo';this.imgs=[...root.querySelectorAll('.photo img')];this.rot=0;this.vel=0;this.snap=null;this.vis=false;this.ready=false;this.resumeAt=0;this.act=-1;this.bind();this.setAuto(!reduce);

  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){this.rot-=.2;this.snap=null}if(e.key==='ArrowRight'){this.rot+=.2;this.snap=null}});
  this.root.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-way],[data-m]');if(!b)return;if(b.dataset.m){this.setMode(b.dataset.m);return}
   if(b.dataset.way!=null){if(this.ready)this.setWay(+b.dataset.way);return}
   const a=b.dataset.a;
   if(a==='rotate'||a==='resume'){this.snap=null;this.resumeAt=0;this.setAuto(true)}
   else if(a==='pause')this.setAuto(false);
   else{this.setAuto(false);this.vel=0;this.snap=this.rot+shortest((a==='front'?0:a==='back'?Math.PI:a*Math.PI/2)-this.rot)}})}

   bar.style.width='25%';try{await document.fonts.load('italic 900 64px "Exo 2"')}catch(e){}
   const C=CF[this.kind],r=this.r=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
   r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
   this.stage.prepend(r.domElement);bar.style.width='60%';

   const bl=new THREE.PointLight(0x00BFFF,1.2,12);bl.position.set(-3,.5,2.5);const vi=new THREE.PointLight(0x873BFF,1.4,12);vi.position.set(3,-.2,-2.5);
   const rim=new THREE.DirectionalLight(0xffffff,.6);rim.position.set(-2,3,-4);sc.add(bl,vi,rim);
   /* glowing platform */
   const pf=new THREE.Group();pf.position.y=C.floor;sc.add(pf);
   const disc=new THREE.Mesh(new THREE.CylinderGeometry(C.pl,C.pl,.04,96),new THREE.MeshStandardMaterial({color:0xEEF0F8,roughness:.25,metalness:.4}));disc.position.y=-.02;disc.receiveShadow=true;pf.add(disc);
   const ring=(rad,col)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(rad,.014,8,160),new THREE.MeshBasicMaterial({color:col,transparent:true}));m.rotation.x=Math.PI/2;m.position.y=.005;pf.add(m);return m};
   this.r1=ring(C.pl*.9,0x00BFFF);this.r2=ring(C.pl*.72,0x873BFF);

  if(!this.drag){
   if(this.snap!=null){const d=shortest(this.snap-this.rot);this.rot+=d*(1-Math.exp(-dt*5));if(Math.abs(d)<.003){this.rot=this.snap;this.snap=null}}

  const o=.75+.25*Math.sin(t/700);this.r1.material.opacity=o;this.r2.material.opacity=1.0-.25*Math.sin(t/700);

  const a=Math.round(w/1.5708)%4;if(a!==this.act){this.act=a;this.root.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('on',i===a))}}}

const viewers=SECTIONS.map(s=>new Viewer(document.getElementById(s.k),s.k));

(function tick(t){requestAnimationFrame(tick);const dt=Math.min(.05,(t-last)/1000);last=t;
